spring:
  application:
    name: order-service

  config:
    import: "optional:configserver:http://localhost:8888"   

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    config:
      uri: http://localhost:8888  
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true   